# AegisOPS - entorno completo.
# Uso:                 docker compose up -d --build
# Con n8n incluido:    docker compose --profile n8n up -d --build
#   (omitir el perfil si ya hay un n8n corriendo en el puerto 5678)
# Variables: copiar .env.example a .env en esta misma carpeta.
#
# Puertos en el host:
#   5433 PostgreSQL | 6333 Qdrant | 8080 Backend (Swagger: /swagger-ui.html)
#   8081 Frontend   | 5678 n8n

name: aegisops

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aegisops}
      POSTGRES_USER: ${DB_USER:-aegisops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      TZ: ${TZ:-America/Bogota}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en 5432
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Esquema y datos iniciales (se ejecutan solo con el volumen vacío)
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: aegisops-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./Backend
    container_name: aegisops-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-aegisops}
      DB_USER: ${DB_USER:-aegisops}
      DB_PASSWORD: ${DB_PASSWORD}
      N8N_BASE_URL: ${N8N_BASE_URL_DOCKER:-http://host.docker.internal:5678}
      N8N_RAG_WEBHOOK: ${N8N_RAG_WEBHOOK:-/webhook/aegisops-rag}
      N8N_INDEX_WEBHOOK: ${N8N_INDEX_WEBHOOK:-/webhook/aegisops-indexar}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.50}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5500,http://127.0.0.1:5500}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: aegisops-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: aegisops-n8n
    profiles: ["n8n"]
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - qdrant
      - backend

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
