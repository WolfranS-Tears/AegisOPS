spring:
  application:
    name: aegisops-backend
  # Carga el .env de la raíz del proyecto (IntelliJ suele arrancar desde la raíz; mvnw desde Backend/).
  # Las variables de entorno reales siguen teniendo prioridad.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/aegisops
    username: aegisops
    password: 0e764b3ef2d908b3e91453d55a5e67cf
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

# Integraciones IA: el frontend nunca llama a n8n, Qdrant ni OpenRouter directamente.
aegisops:
  n8n:
    base-url: ${N8N_BASE_URL:http://localhost:5678}
    rag-webhook: ${N8N_RAG_WEBHOOK:/webhook/aegisops-rag}
    index-webhook: ${N8N_INDEX_WEBHOOK:/webhook/aegisops-indexar}
    timeout: ${N8N_TIMEOUT:60s}
  rag:
    # Similitud coseno mínima (0-1). Justificación en docs/informe-analisis-datos.md
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.50}
    top-k: ${RAG_TOP_K:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081}
  internal:
    token: ${INTERNAL_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
