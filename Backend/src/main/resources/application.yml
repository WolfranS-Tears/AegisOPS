spring:
  application:
    name: aegisops-backend
  # Carga el .env de la raíz del proyecto (IntelliJ suele arrancar desde la raíz; mvnw desde Backend/).
  # Las variables de entorno reales siguen teniendo prioridad.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/aegisops
    username: aegisops
    password: 0e764b3ef2d908b3e91453d55a5e67cf
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

# Integraciones IA: el frontend nunca llama a n8n, Qdrant ni OpenRouter directamente.
aegisops:
  n8n:
    base-url: http://localhost:5678
    rag-webhook: /webhook/aegisops-rag
    index-webhook: /webhook/aegisops-indexar
    timeout: 60s
  rag:
    # Similitud coseno mínima (0-1). Justificación en docs/informe-analisis-datos.md
    similarity-threshold: 0.50
    top-k: 5
  cors:
    allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081
  internal:
    token: ea3a55936d8a62c181ba71a880dd27df

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
