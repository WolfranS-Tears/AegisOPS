<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisOps — Asistente RAG</title>
    <script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
    <script src="../js/index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body data-pagina="asistente" class="bg-dark-surface text-dark-on-surface font-body antialiased min-h-screen">

<main id="contenido" class="min-h-screen">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">

        <div>
            <h1 class="font-headline text-headline-lg font-bold">Asistente <span class="text-rag-ai">RAG</span></h1>
            <p class="text-body-md text-dark-secondary">Busca soluciones en la base de conocimiento por similitud semántica y genera una orientación basada solo en esas fuentes.</p>
        </div>

        <form id="form-consulta" class="tarjeta p-4 space-y-4" novalidate>
            <div>
                <label class="etiqueta" for="c-incidente">Incidente asociado (opcional)</label>
                <select class="campo" id="c-incidente" name="incidenteId">
                    <option value="">Sin incidente — consulta libre</option>
                </select>
            </div>
            <div id="incidente-info" class="hidden p-3 rounded border border-dark-outline bg-dark-surface-container/40 text-body-sm"></div>
            <div>
                <label class="etiqueta" for="c-pregunta">Descripción del problema</label>
                <textarea class="campo" id="c-pregunta" name="pregunta" rows="4" maxlength="2000"
                    placeholder="Ej.: El equipo no tiene internet y la IP empieza por 169.254"></textarea>
                <span class="error-campo" id="error-pregunta" data-error-for="pregunta" role="alert"></span>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-3">
                <span class="text-body-sm text-dark-secondary">La consulta pasa por Spring Boot → n8n → Qdrant/OpenRouter. Queda registrada en el historial.</span>
                <button type="submit" id="btn-consultar" class="btn btn-ia"><span class="material-symbols-outlined text-[18px]">auto_awesome</span>Consultar asistente</button>
            </div>
        </form>

        <section id="resultado" aria-live="polite"></section>

        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-headline text-title-lg font-bold" id="titulo-historial">Historial del incidente</h2>
                <a href="historial.html" class="text-body-sm text-accent hover:underline">Ver todo el historial</a>
            </div>
            <div id="historial" class="space-y-4"></div>
        </section>
    </div>
</main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/consulta-render.js"></script>
<script src="../js/asistente.js"></script>
</body>
</html>
